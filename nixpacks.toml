[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.pdo_pgsql", "php84Extensions.pgsql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.zip", "php84Extensions.intl", "php84Extensions.opcache", "php84Extensions.exif", "php84Extensions.pcntl", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist",
  "npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "npm run build",
  "chmod +x start.sh"
]

[start]
cmd = "bash start.sh"
