[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.zip", "php84Extensions.intl", "php84Extensions.opcache", "php84Extensions.exif", "php84Extensions.pcntl", "nodejs_22", "nodePackages.npm"]

[phases.install]
cmds = [
  "curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer",
  "composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist",
  "npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force --no-interaction && php artisan serve --host=0.0.0.0 --port=$PORT"
