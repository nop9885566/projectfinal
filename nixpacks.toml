[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.bcmath", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.intl", "php83Extensions.opcache", "php83Extensions.exif", "php83Extensions.pcntl", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist",
  "npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "npm run build",
  "chmod +x start.sh"
]

[start]
cmd = "bash start.sh"
